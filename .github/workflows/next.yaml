name: next

on: workflow_dispatch

jobs:
  build-push:
    permissions:
      packages: write
    runs-on:
      - self-hosted
      - pkgs
    services:
      buildkitd:
        image: moby/buildkit:v0.18.2
        options: --privileged
        ports:
          - 1234:1234
        volumes:
          - /var/lib/buildkit/${{ github.repository }}:/var/lib/buildkit
          - /usr/etc/buildkit/buildkitd.toml:/etc/buildkit/buildkitd.toml
      docker:
        image: docker:dind
        options: --privileged
        ports:
          - 22375:2375
        env:
          TEST_INTEGRATION_USE_SNAPSHOTTER: "1"
          DOCKER_TLS_CERTDIR: ""
    steps:
      -
        name: gather-system-info
        id: system-info
        uses: kenchan0130/actions-system-info@v1.3.0
        continue-on-error: true
      -
        name: print-system-info
        run: |
          MEMORY_GB=$((${{ steps.system-info.outputs.totalmem }}/1024/1024/1024))

          OUTPUTS=(
            "CPU Core: ${{ steps.system-info.outputs.cpu-core }}"
            "CPU Model: ${{ steps.system-info.outputs.cpu-model }}"
            "Hostname: ${{ steps.system-info.outputs.hostname }}"
            "NodeName: ${NODE_NAME}"
            "Kernel release: ${{ steps.system-info.outputs.kernel-release }}"
            "Kernel version: ${{ steps.system-info.outputs.kernel-version }}"
            "Name: ${{ steps.system-info.outputs.name }}"
            "Platform: ${{ steps.system-info.outputs.platform }}"
            "Release: ${{ steps.system-info.outputs.release }}"
            "Total memory: ${MEMORY_GB} GB"
          )

          for OUTPUT in "${OUTPUTS[@]}";do
            echo "${OUTPUT}"
          done
        continue-on-error: true
      - name: Install Python 3.11
        run: |
          sudo apt update
          sudo apt install -y python3.11
      - uses: imjasonh/setup-crane@v0.1
      -
        name: Checkout
        uses: actions/checkout@v4
      - name: info1
        run: |
          docker info
      - name: switch
        run: |
          echo "DOCKER_HOST=tcp://127.0.0.1:22375" >> $GITHUB_ENV
          sleep 20
      - name: info2
        run: |
          docker info
      -
        name: Set up Docker Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@v3
        with:
          append: |
            - endpoint: tcp://buildkit-arm64.ci.svc.cluster.local:1234
              platforms: linux/arm64
          driver: remote
          endpoint: tcp://127.0.0.1:1234
      -
        name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Preseed
        run: |
          make preseed
          ./src/preseed-pkg.sh bootstrap-stage2 bootstrap-stage2:latest
          ./src/preseed-pkg.sh bootstrap-stage3 bootstrap-stage3:latest
          ./src/preseed-pkg.sh core-filesystem core-filesystem:latest
          ./src/preseed-pkg.sh core-binutils core-binutils:2.43.1
          ./src/preseed-pkg.sh core-busybox core-busybox:1.36.1
          ./src/preseed-pkg.sh core-gcc core-gcc:13.1.0
          ./src/preseed-pkg.sh core-make core-make:4.4
          ./src/preseed-pkg.sh core-musl core-musl:1.2.4
      - name: Build diffutils
        run: |
          make diffutils PROGRESS=plain PLATFORM=linux/amd64,linux/arm64
      - name: Push diffutils
        run: |
          ./src/publish-pkg.sh core-diffutils 3.10
      - name: Build go
        run: |
          make go PROGRESS=plain PLATFORM=linux/amd64,linux/arm64
      - name: Push go
        run: |
          ./src/publish-pkg.sh core-go 1.23.1
      - name: Build perl
        run: |
          make perl PROGRESS=plain PLATFORM=linux/amd64,linux/arm64
      - name: Push perl
        run: |
          ./src/publish-pkg.sh core-perl 5.38.0
      - name: Build texinfo
        run: |
          make texinfo PROGRESS=plain PLATFORM=linux/amd64,linux/arm64
      - name: Push texinfo
        run: |
          ./src/publish-pkg.sh core-texinfo 7.1
